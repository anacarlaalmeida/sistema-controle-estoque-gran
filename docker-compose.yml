services:
  backend:
    build: ./backend
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - backend-database:/usr/src/app/database
      - backend-uploads:/usr/src/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-database:
  backend-uploads:
  frontend-node-modules:
