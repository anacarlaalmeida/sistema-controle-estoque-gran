services:
  backend:
    build: ./backend
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
    volumes:
      - backend-database:/usr/src/app/database
      - backend-uploads:/usr/src/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend-database:
  backend-uploads:
  frontend-node-modules:
